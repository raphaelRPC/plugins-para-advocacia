name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "testes/*.test.mjs"
      - run: node ferramentas/checar.mjs --tag "$GITHUB_REF_NAME"
      - run: node ferramentas/sincronizar.mjs --verificar
      - run: node ferramentas/montar_zips.mjs --versao "${GITHUB_REF_NAME#v}" --saida dist
      - run: node ferramentas/versao.mjs notas "${GITHUB_REF_NAME#v}" > notas.md
      - run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip dist/plugins/*.zip dist/SHA256SUMS.txt
          --draft
          --title "Plugins para advocacia $GITHUB_REF_NAME"
          --notes-file notas.md
        env:
          GH_TOKEN: ${{ github.token }}
