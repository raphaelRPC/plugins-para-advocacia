name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "testes/*.test.mjs"
      - run: node ferramentas/checar.mjs --tag "$GITHUB_REF_NAME"
      - run: node ferramentas/sincronizar.mjs --verificar
      - name: Montar os pacotes de cada ticket
        run: node ferramentas/montar_entregas.mjs --versao "${GITHUB_REF_NAME#v}" --saida entregas-geradas | tee resumo.txt
      - name: Notas do release
        run: |
          {
            echo "## Pacotes por ticket"
            echo
            grep ' habilidades ' resumo.txt | sed 's/^/- /'
            echo
            echo "Cada pacote traz o LEIA-ME e, na pasta plugins, um zip por plugin para enviar no app do Claude."
            echo
            echo "## O que mudou"
            echo
            node ferramentas/versao.mjs notas "${GITHUB_REF_NAME#v}"
          } > notas.md
      - run: >
          gh release create "$GITHUB_REF_NAME"
          entregas-geradas/*/zips/*.zip entregas-geradas/SHA256SUMS.txt
          --draft
          --title "Plugins para advocacia $GITHUB_REF_NAME"
          --notes-file notas.md
        env:
          GH_TOKEN: ${{ github.token }}
