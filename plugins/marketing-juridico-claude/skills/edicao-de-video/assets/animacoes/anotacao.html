<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Anotação sobre imagem</title>
<!-- Anotação sobre imagem: um print ou página real aparece acima da cabeça e o traço de caneta aponta o detalhe:
     seta desenhada, círculo à mão ou sublinhado, cada um na sua marca.
     Posições em porcentagem da imagem (0 a 100). Só imagem com fonte; nada de dado de cliente, decisão própria ou valores.
     DADOS: imagem (em midia/), largura (padrão 900), alturaMax (padrão 640), setas [{de:[x,y], para:[x,y]}],
            circulos [{x, y, w, h}], sublinhados [{x, y, w}], fonte, marcas [imagem, traço 1, traço 2...], fim, familia, cores -->
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#c{position:absolute;top:250px;left:90px}
#moldura{position:relative;overflow:hidden;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.4);background:#fff}
.cel #moldura{border-radius:0;box-shadow:none}
#moldura img{display:block}
svg{position:absolute;inset:0;overflow:visible}
svg path{fill:none;stroke:var(--c-alerta);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
#fonte{margin-top:16px;font:600 24px var(--t-texto);letter-spacing:.12em;text-transform:uppercase;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6)}
</style></head><body>
<div id="c"><div id="moldura"><img alt=""><svg id="sv"></svg></div><div id="fonte"></div></div>
<script src="base.js"></script>
<script>
const D = DADOS, c = document.getElementById('c'), img = c.querySelector('img'), sv = document.getElementById('sv');
if (FAMILIA === 'celular') document.body.classList.add('cel');
document.getElementById('fonte').textContent = D.fonte ? 'Fonte: ' + D.fonte : '';
img.src = U.midia(D.imagem);
const L = D.largura ?? 900, HM = D.alturaMax ?? 640;
let tracos = [];
function montar() {
  const h = Math.min(HM, Math.round(img.naturalHeight * L / (img.naturalWidth || 1)));
  img.style.width = L + 'px'; document.getElementById('moldura').style.height = h + 'px';
  const W = L, H = img.naturalHeight * L / (img.naturalWidth || 1);   // posições valem para a imagem inteira
  sv.setAttribute('viewBox', `0 0 ${W} ${h}`); sv.style.width = W + 'px'; sv.style.height = h + 'px';
  const X = v => v / 100 * W, Y = v => v / 100 * H, ns = 'http://www.w3.org/2000/svg';
  const caminho = d => { const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); sv.appendChild(p); return p; };
  for (const s of D.setas || []) {
    const [x0, y0] = [X(s.de[0]), Y(s.de[1])], [x1, y1] = [X(s.para[0]), Y(s.para[1])];
    const mx = (x0 + x1) / 2 + (y1 - y0) * 0.18, my = (y0 + y1) / 2 - (x1 - x0) * 0.18;   // curva de mão
    const a = Math.atan2(y1 - my, x1 - mx), k = 34;
    tracos.push([caminho(`M${x0},${y0} Q${mx},${my} ${x1},${y1}`),
      caminho(`M${x1 - k * Math.cos(a - 0.5)},${y1 - k * Math.sin(a - 0.5)} L${x1},${y1} L${x1 - k * Math.cos(a + 0.5)},${y1 - k * Math.sin(a + 0.5)}`)]);
  }
  for (const o of D.circulos || []) {
    const cx = X(o.x + o.w / 2), cy = Y(o.y + o.h / 2), rx = X(o.w) / 2 + 14, ry = Y(o.h) / 2 + 12;
    tracos.push([caminho(`M${cx + rx},${cy - 6} C${cx + rx},${cy - ry * 1.3} ${cx - rx * 1.15},${cy - ry * 1.1} ${cx - rx},${cy} C${cx - rx * 0.9},${cy + ry * 1.25} ${cx + rx * 1.1},${cy + ry * 1.1} ${cx + rx * 0.98},${cy - ry * 0.35}`)]);
  }
  for (const u of D.sublinhados || []) tracos.push([caminho(`M${X(u.x)},${Y(u.y)} q${X(u.w) / 2},10 ${X(u.w)},-4`)]);
  const r = c.getBoundingClientRect(); window.AREA = { x: 0, y: Math.max(0, Math.floor(r.top) - 60), w: 1080, h: Math.ceil(r.height) + 160 };
  window.PRONTO = true;
}
const MK = U.marcas(1 + (D.setas || []).length + (D.circulos || []).length + (D.sublinhados || []).length, FIM);
window.AREA = { x: 0, y: 190, w: 1080, h: 900 };
window.desenhar = t => {
  c.style.opacity = U.janela(t, FIM, 0.3, 0.35);
  const e = U.mola(t - MK[0], 0.5); c.style.transform = `translateY(${(1 - e) * 40}px)`;
  tracos.forEach((ps, i) => { const p = U.pr(t, MK[i + 1], MK[i + 1] + 0.5); ps.forEach((pp, j) => U.traco(pp, j === 0 ? U.eo(p * 1.15) : U.pr(p, 0.8, 1))); });
};
document.fonts.ready.then(() => { if (img.complete && img.naturalWidth) montar(); else { img.onload = montar; img.onerror = () => { window.PRONTO = true; }; } });
</script>
</body></html>
