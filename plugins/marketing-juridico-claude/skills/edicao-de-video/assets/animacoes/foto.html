<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Foto de apoio</title>
<!-- Foto de apoio, acima da cabeça.
     modo "foco": a foto desce e entra em foco, com etiqueta (ARQUIVO 2014, ILUSTRAÇÃO, nome do lugar) e crédito: tom documental;
     modo "janela": uma janela acima da cabeça em que as fotos trocam, uma por marca, com um leve avanço da câmera.
     Só lugar, instituição, documento público ou matéria; nunca parte, cliente ou autoridade em uso promocional. Imagem de arquivo leva o ano.
     DADOS: modo, imagens [em midia/], etiqueta, credito, largura, altura, marcas [uma por foto], fim, familia, cores -->
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#c{position:absolute;top:250px;left:50%}
#f{position:relative;overflow:hidden;border-radius:20px;box-shadow:0 26px 60px rgba(0,0,0,.45);background:#222}
.cel #f{border-radius:0}
#f img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#tag{position:absolute;left:20px;top:20px;background:rgba(17,17,17,.88);color:#fff;font:600 24px var(--t-texto);letter-spacing:.16em;text-transform:uppercase;padding:9px 16px;border-radius:6px}
#cred{margin-top:12px;font:500 22px var(--t-texto);color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);text-align:right}
</style></head><body>
<div id="c"><div id="f"><span id="tag"></span></div><div id="cred"></div></div>
<script src="base.js"></script>
<script>
const D = DADOS, modo = D.modo || 'foco', c = document.getElementById('c'), f = document.getElementById('f');
if (FAMILIA === 'celular') document.body.classList.add('cel');
const W = D.largura ?? (modo === 'foco' ? 760 : 860), H = D.altura ?? (modo === 'foco' ? 520 : 480);
f.style.width = W + 'px'; f.style.height = H + 'px'; c.style.marginLeft = (-W / 2) + 'px';
const tag = document.getElementById('tag'); tag.textContent = D.etiqueta || ''; if (!D.etiqueta) tag.style.display = 'none';
document.getElementById('cred').textContent = D.credito || '';
const imgs = (D.imagens || (D.imagem ? [D.imagem] : [])).map(a => { const i = document.createElement('img'); i.src = U.midia(a); f.insertBefore(i, tag); return i; });
const MK = U.marcas(Math.max(1, imgs.length), FIM);
window.AREA = { x: 0, y: 200, w: 1080, h: H + 160 };
window.desenhar = t => {
  c.style.opacity = U.janela(t, FIM, 0.3, 0.35);
  if (modo === 'foco') {
    const p = U.mola(t - MK[0], 0.7), foco = SECO ? 0 : 18 * (1 - U.eo(U.pr(t, MK[0], MK[0] + 0.9)));
    c.style.transform = `translateY(${(1 - p) * -80}px) rotate(${(1 - p) * -3 - 0.8}deg)`;
    imgs.forEach(i => { i.style.filter = `blur(${foco}px)`; i.style.transform = `scale(${1.04 + 0.05 * U.pr(t, MK[0], FIM)})`; });
  } else {
    const e = U.mola(t, 0.5); c.style.transform = `translateY(${(1 - e) * 40}px)`;
    let k = 0; MK.forEach((m, i) => { if (t >= m) k = i; });
    imgs.forEach((i, j) => { const ent = j === 0 ? 1 : U.eo(U.pr(t, MK[j], MK[j] + 0.4)); i.style.opacity = j === k ? ent : (j === k - 1 ? 1 : 0); i.style.zIndex = j === k ? 2 : 1;
      i.style.transform = `scale(${1.02 + 0.06 * U.pr(t, MK[j], (MK[j + 1] ?? FIM) + 0.4)})`; });
  }
  tag.style.opacity = U.eo(U.pr(t, MK[0] + 0.5, MK[0] + 0.9));
};
const pronto = () => { window.PRONTO = true; };
document.fonts.ready.then(() => Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))).then(pronto));
</script>
</body></html>
