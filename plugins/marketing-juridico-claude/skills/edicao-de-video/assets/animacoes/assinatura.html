<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Assinatura com o nome</title>
<!-- Assinatura: o nome se escreve da esquerda para a direita, um fio se desenha embaixo e a linha de identificação
     (o @, a área ou, se o advogado pedir, a OAB/UF) aparece. Para abrir ou fechar o vídeo.
     DADOS: nome, linha (ex.: "@seuperfil" ou "OAB/SP 123.456"), posicao ("alto" | "baixo"), fim, familia, cores -->
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#c{position:absolute;left:84px}
#nome{position:relative;font:italic 400 92px/1.1 var(--t-serifa);color:var(--c-texto);white-space:nowrap;text-shadow:0 3px 16px rgba(0,0,0,.55);clip-path:inset(-20% 100% -20% 0)}
#fio{height:5px;background:var(--c-destaque);transform-origin:left center;margin:10px 0 18px;border-radius:3px}
#linha{font:600 34px var(--t-texto);letter-spacing:.16em;text-transform:uppercase;color:var(--c-texto);text-shadow:0 2px 12px rgba(0,0,0,.6)}
.inst #c{background:var(--c-fundo);border-radius:24px;padding:28px 40px 30px}
.inst #nome,.inst #linha{text-shadow:none}
</style></head><body>
<div id="c"><div id="nome"></div><div id="fio"></div><div id="linha"></div></div>
<script src="base.js"></script>
<script>
const D = DADOS, c = document.getElementById('c'), nome = document.getElementById('nome');
if (FAMILIA === 'institucional') document.body.classList.add('inst');
nome.textContent = D.nome || 'Seu Nome'; document.getElementById('linha').textContent = D.linha || '';
const baixo = D.posicao === 'baixo';
c.style.top = (baixo ? 1190 : 240) + 'px';
window.AREA = { x: 0, y: baixo ? 1150 : 200, w: 1080, h: 330 };
window.desenhar = t => {
  c.style.opacity = U.janela(t, FIM, 0.2, 0.35);
  const p = SECO ? 1 : U.eio(U.pr(t, 0.1, 1.3));
  nome.style.clipPath = `inset(-20% ${100 - p * 100}% -20% 0)`;
  document.getElementById('fio').style.width = nome.offsetWidth + 'px';
  document.getElementById('fio').style.transform = `scaleX(${SECO ? 1 : U.eo(U.pr(t, 1.0, 1.6))})`;
  const l = U.mola(t - 1.4, 0.45); document.getElementById('linha').style.opacity = U.clamp(l * 1.5);
  document.getElementById('linha').style.transform = `translateY(${(1 - l) * 16}px)`;
};
document.fonts.ready.then(() => { window.PRONTO = true; });
</script>
</body></html>
