<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Notebook em 3D</title>
<!-- Notebook em 3D: a tampa abre, o aparelho gira devagar e mostra uma imagem real na tela.
     DADOS: imagem (arquivo em pastaMidia), selo (texto opcional), topo (y da área), escala (1 = padrão), seloTopo e seloDireita (posição do selo), fim, cores -->
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:"Avenir Next",Helvetica,Arial,sans-serif}
#c{position:absolute;left:0}
#selo{position:absolute;right:120px;display:flex;align-items:center;gap:14px;padding:16px 30px;border-radius:999px;background:#fff;color:#14243F;font-weight:800;font-size:34px;letter-spacing:.06em;box-shadow:0 14px 40px rgba(0,0,0,.28);transform-origin:right center}
#selo i{width:16px;height:16px;border-radius:50%;background:var(--d)}
#selo.limpo{background:transparent;box-shadow:none;color:#fff;font-weight:600;font-size:30px;letter-spacing:.2em;text-shadow:0 2px 12px rgba(0,0,0,.65)}
#selo.limpo i{width:46px;height:4px;border-radius:2px}
</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas><div id="selo"><i></i><span></span></div>
<script src="base.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const D = DADOS, A = { x: 0, y: D.topo ?? 200, w: 1080, h: 820 };
window.AREA = A;
const canvas = document.getElementById('c'); canvas.style.top = A.y + 'px';
const r = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(A.w, A.h); r.setClearColor(0x000000, 0); r.outputColorSpace = THREE.SRGBColorSpace;
const cena = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(28, A.w / A.h, 0.1, 100);
cam.position.set(0, 2.3, 8.4); cam.lookAt(0, 0.95, 0);
cena.add(new THREE.HemisphereLight(0xffffff, 0x3a4250, 1.7));
const luz = new THREE.DirectionalLight(0xffffff, 2.4); luz.position.set(3, 6, 5); cena.add(luz);
const metal = new THREE.MeshStandardMaterial({ color: 0xc8ccd2, metalness: 0.55, roughness: 0.36 });
const escuro = new THREE.MeshStandardMaterial({ color: 0x1a1e25, metalness: 0.1, roughness: 0.7 });

const note = new THREE.Group(); cena.add(note);
const base = new THREE.Mesh(new RoundedBoxGeometry(3.3, 0.12, 2.25, 4, 0.05), metal); base.position.y = 0.06; note.add(base);
const tecl = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 1.05), escuro); tecl.rotation.x = -Math.PI / 2; tecl.position.set(0, 0.121, -0.3); note.add(tecl);
const track = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.6), new THREE.MeshStandardMaterial({ color: 0xb7bcc4, metalness: .45, roughness: .4 }));
track.rotation.x = -Math.PI / 2; track.position.set(0, 0.122, 0.62); note.add(track);
// tampa presa na dobradiça de trás; aberta = levemente inclinada para trás
const dob = new THREE.Group(); dob.position.set(0, 0.12, -1.1); note.add(dob);
const tampa = new THREE.Mesh(new RoundedBoxGeometry(3.3, 2.15, 0.07, 4, 0.03), metal); tampa.position.set(0, 1.075, 0); dob.add(tampa);
const moldura = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 2.05), new THREE.MeshBasicMaterial({ color: 0x0b0d10 })); moldura.position.set(0, 1.075, 0.036); dob.add(moldura);
const telaMat = new THREE.MeshBasicMaterial({ color: 0x222831, toneMapped: false });
const tela = new THREE.Mesh(new THREE.PlaneGeometry(3.04, 1.9), telaMat); tela.position.set(0, 1.085, 0.037); dob.add(tela);
// sombra suave no chão
const sc = document.createElement('canvas'); sc.width = sc.height = 256; const g = sc.getContext('2d');
const rg = g.createRadialGradient(128, 128, 10, 128, 128, 128); rg.addColorStop(0, 'rgba(0,0,0,.45)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
const sombra = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 3.4), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false }));
sombra.rotation.x = -Math.PI / 2; sombra.position.y = -0.01; note.add(sombra);

const selo = document.getElementById('selo');
selo.style.top = (D.seloTopo ?? (A.y + A.h - 150)) + 'px'; if (D.seloDireita != null) selo.style.right = D.seloDireita + 'px'; selo.style.setProperty('--d', COR.destaque);
if (FAMILIA !== 'institucional') selo.classList.add('limpo');
selo.querySelector('span').textContent = D.selo || '';
if (!D.selo) selo.style.display = 'none';

window.desenhar = t => {
  const ent = U.mola(t, 0.75), al = U.janela(t, FIM, 0.3, 0.35);
  note.scale.setScalar((0.55 + 0.45 * ent) * (D.escala || 1));
  note.position.y = (1 - ent) * -0.8;
  dob.rotation.x = U.lerp(Math.PI / 2, -0.2, U.eio(U.pr(t, 0.25, 1.25)));
  note.rotation.y = U.lerp(-0.62, 0.38, U.eio(U.pr(t, 0, Math.max(FIM, 2))));
  note.rotation.x = 0.06 * Math.sin(t * 0.9);
  canvas.style.opacity = al;
  r.render(cena, cam);
  const ps = U.mola(t - 1.0, 0.5);
  selo.style.opacity = U.clamp(ps) * al;
  selo.style.transform = `scale(${0.7 + 0.3 * ps})`;
};
if (D.imagem) new THREE.TextureLoader().load('/midia/' + D.imagem, tx => {
  tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8;
  telaMat.map = tx; telaMat.color.set(0xffffff); telaMat.needsUpdate = true; window.PRONTO = true;
}, undefined, () => { window.PRONTO = true; });
else window.PRONTO = true;
</script>
</body></html>
