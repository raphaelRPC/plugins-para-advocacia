<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Trilha de passos</title>
<!-- Trilha de passos: painel lateral com as etapas apagadas; cada uma acende na sua marca (fala).
     DADOS: passos [..], marcas [..] (segundos desde a entrada), rotulo, lado ("esquerda" | "direita"),
     orientacao ("vertical" | "horizontal": faixa no alto da tela, sem cobrir o rosto), topo, fim, cores -->
<style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:"Avenir Next",Helvetica,Arial,sans-serif}
#p{position:absolute;width:430px;padding:34px 34px 30px;border-radius:30px;background:rgba(20,36,63,.92);box-shadow:0 20px 50px rgba(0,0,0,.3);box-sizing:border-box}
#rot{font-weight:600;font-size:24px;letter-spacing:.14em;color:rgba(255,255,255,.7);margin-bottom:22px;text-transform:uppercase}
.l{position:relative;display:flex;align-items:center;gap:20px;height:92px}
.c{position:relative;z-index:2;flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:28px;border:3px solid rgba(255,255,255,.35);color:rgba(255,255,255,.55);box-sizing:border-box}
.n{font-weight:700;font-size:38px;color:rgba(255,255,255,.45);white-space:nowrap}
.fio{position:absolute;left:27px;top:62px;width:4px;height:58px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.fio i{display:block;width:100%;height:0;background:var(--d)}
/* horizontal: uma faixa no alto, passos lado a lado, nome embaixo de cada número */
#p.h{width:1000px;padding:26px 24px 22px}
#p.h #rot{text-align:center;margin-bottom:16px}
#p.h #lista{display:flex;justify-content:space-between}
#p.h .l{flex:1;flex-direction:column;gap:12px;height:auto}
#p.h .n{font-size:27px;text-align:center;white-space:normal;line-height:1.1;max-width:150px}
#p.h .fio{left:calc(50% + 32px);top:27px;width:calc(100% - 64px);height:4px}
#p.h .fio i{height:100%;width:0}
/* famílias sem caixa: sem painel, texto com sombra; na revista, nomes em serifa itálica */
#p.limpo{background:transparent;box-shadow:none}
#p.limpo::before{content:"";position:absolute;inset:-40px -30px;background:radial-gradient(ellipse at center,rgba(0,0,0,.42) 0%,rgba(0,0,0,.22) 55%,rgba(0,0,0,0) 78%);z-index:-1;border-radius:50%}
#p.limpo .n{color:#fff!important;font-size:31px}
#p.limpo.rev .n{font-size:37px}
#p.limpo .c{border-color:rgba(255,255,255,.75)}
#p.limpo .n,#p.limpo #rot{text-shadow:0 2px 14px rgba(0,0,0,.6),0 0 4px rgba(0,0,0,.35)}
#p.limpo .c{background:rgba(0,0,0,.18)}
#p.limpo.rev .n{font-family:"Didot","Bodoni 72",Georgia,serif;font-style:italic;font-weight:400;font-size:31px}
#p.limpo.rev .c{font-family:"Didot","Bodoni 72",Georgia,serif;font-weight:400}
</style></head><body>
<div id="p"><div id="rot"></div><div id="lista"></div></div>
<script src="base.js"></script>
<script>
const D = DADOS, passos = D.passos || [], n = passos.length;
const esq = (D.lado || 'esquerda') === 'esquerda', hor = D.orientacao === 'horizontal';
const H = hor ? 26 + (D.rotulo ? 46 : 0) + 130 + 22 : 34 + (D.rotulo ? 52 : 0) + n * 92 + 30;
const A = hor ? { x: 10, y: D.topo ?? 220, w: 1060, h: H + 60 } : { x: esq ? 30 : 1080 - 30 - 430 - 30, y: D.topo ?? 360, w: 490, h: H + 40 };
window.AREA = A;
const p = document.getElementById('p');
if (hor) p.classList.add('h');
if (FAMILIA !== 'institucional') p.classList.add('limpo'); if (FAMILIA === 'revista') p.classList.add('rev');
p.style.left = (A.x + (hor ? 30 : esq ? 0 : 30)) + 'px'; p.style.top = (A.y + 10) + 'px';
p.style.setProperty('--d', COR.destaque);
document.getElementById('rot').textContent = D.rotulo || ''; if (!D.rotulo) document.getElementById('rot').style.display = 'none';
const lista = document.getElementById('lista');
passos.forEach((txt, i) => {
  const l = document.createElement('div'); l.className = 'l';
  l.innerHTML = `<div class="c">${i + 1}</div><div class="n"></div>` + (i < n - 1 ? '<div class="fio"><i></i></div>' : '');
  l.querySelector('.n').textContent = txt; lista.appendChild(l);
});
const linhas = [...lista.children], MK = U.marcas(n, FIM);
window.desenhar = t => {
  const al = U.janela(t, FIM, 0.3, 0.35), ent = U.mola(t, 0.6);
  p.style.opacity = al;
  p.style.transform = hor ? `translateY(${(1 - ent) * -60}px)` : `translateX(${(1 - ent) * (esq ? -80 : 80)}px)`;
  linhas.forEach((l, i) => {
    const ap = U.eo(U.pr(t, 0.1 + i * 0.06, 0.4 + i * 0.06));         // a linha aparece apagada
    const ac = U.mola(t - MK[i], 0.45);                                 // acende na marca
    const at = U.clamp(ac);
    l.style.opacity = ap; l.style.transform = hor ? `translateY(${(1 - ap) * 12}px)` : `translateY(${(1 - ap) * 16}px)`;
    const c = l.querySelector('.c'), nm = l.querySelector('.n');
    c.style.background = at > 0 ? COR.destaque : (FAMILIA !== 'institucional' ? 'rgba(0,0,0,.18)' : 'transparent'); c.style.opacity = at > 0 ? Math.max(.35, at) : 1;
    c.style.borderColor = at > 0.5 ? COR.destaque : 'rgba(255,255,255,.35)';
    c.style.color = at > 0.5 ? COR.fundo : 'rgba(255,255,255,.55)';
    c.style.transform = `scale(${1 + 0.18 * Math.max(0, ac - at) + (at > 0 && at < 1 ? 0.1 * at : 0)})`;
    nm.style.color = `rgba(255,255,255,${0.45 + 0.55 * at})`;
    const fio = l.querySelector('.fio i');
    const enche = (U.eo(U.pr(t, MK[i] + 0.2, (MK[i + 1] ?? FIM) - 0.05)) * 100) + '%';
    if (fio) { if (hor) fio.style.width = enche; else fio.style.height = enche; }
  });
};
document.fonts.ready.then(() => { window.PRONTO = true; });
</script>
</body></html>
